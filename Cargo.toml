[package]
name = "pito-compare"
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
description = "Comparison charts as PNGs from a JSON or TOML file: paired bars, balanced ratios and single bars"
license = "MIT"
repository = "https://github.com/gmrdad82/pito-compare"
homepage = "https://pitomd.com"
readme = "README.md"
publish = false

[lib]
name = "pito_compare"
path = "src/lib.rs"

[[bin]]
name = "pcmp"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
